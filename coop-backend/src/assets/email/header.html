<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#fff}
  .h{position:relative;width:1200px;height:360px;overflow:hidden;font-family:'Kanit','Sarabun',sans-serif}
  .h img.bg{position:absolute;left:0;top:0;width:1200px;height:360px}
  .logo{position:absolute;left:72px;top:58px;width:164px;height:164px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .logo img{width:148px;height:148px;border-radius:50%}
  .t1{position:absolute;left:276px;top:62px;font-size:62px;font-weight:700;color:#fff;line-height:1.25;white-space:nowrap}
  .t2{position:absolute;left:276px;top:140px;font-size:36px;color:#E9D5FF;line-height:1.3;white-space:nowrap}
  .row{position:absolute;left:72px;top:250px;display:flex;align-items:center;gap:18px}
  .chip{background:#FDE68A;color:#5B21B6;font-weight:700;font-size:28px;letter-spacing:1px;padding:6px 20px;border-radius:12px}
  .sys{font-size:30px;color:#F3E8FF}
</style></head><body>
<div class="h">
  <img class="bg" src="header-bg.svg">
  <div class="logo"><img src="sskru-logo.png"></div>
  <div class="t1">คณะศิลปศาสตร์และวิทยาศาสตร์</div>
  <div class="t2">มหาวิทยาลัยราชภัฏศรีสะเกษ</div>
  <div class="row"><span class="chip">LASC</span><span class="sys">ระบบบริหารจัดการการฝึกประสบการณ์วิชาชีพ</span></div>
</div>
</body></html>
