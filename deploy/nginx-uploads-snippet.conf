# =====================================================================
# Nginx snippet — students.sci-sskru.com (เสิร์ฟไฟล์อัปโหลด coop-backend)
#
# วางบล็อกนี้ใน server {} ของเว็บ production แล้ว:
#   sudo nginx -t && sudo systemctl reload nginx
#
# รูปทั้งหมดในระบบถูกเรียกผ่าน /coop/api/uploads/... (frontend
# ต่อ URL ด้วย API_BASE) ดังนั้น proxy เดิมที่มีอยู่แล้วเพียงพอ —
# บล็อกด้านล่างเป็น "ทางเลือก" ถ้าอยากให้ nginx เสิร์ฟไฟล์ตรง
# (เร็วกว่า ลดโหลด node) หรือเผื่อมีรูปเก่าที่อ้างผ่าน /uploads/...
# =====================================================================

# [ทางเลือก 1] เสิร์ฟตรงจาก disk (แนะนำ — เร็วสุด ไม่ผ่าน node)
#   เปลี่ยน /path/to ให้ตรงที่เก็บโค้ดบนเซิร์ฟเวอร์จริง
# location /coop/api/uploads/ {
#     alias /path/to/lasc-students_app/coop-backend/uploads/;
#     access_log off;
#     expires 30d;
#     add_header Cache-Control "public, no-transform";
# }

# [ทางเลือก 2] รองรับลิงก์เก่ารูปแบบ /uploads/... (ไม่มี /coop/api นำหน้า)
# location /uploads/ {
#     alias /path/to/lasc-students_app/coop-backend/uploads/;
#     access_log off;
#     expires 30d;
#     add_header Cache-Control "public, no-transform";
# }

# [ทางเลือก 3] proxy ต่อไป backend เดิม (ไม่ต้องตั้งค่าใหม่ ใช้ location
#   /coop/api/ → coop-backend:5000 ที่มีอยู่ — express mount static
#   ครบทั้ง /uploads, /api/uploads และ /coop/api/uploads แล้ว)

# ---------------------------------------------------------------------
# Linux permissions (ถ้าเสิร์ฟตรงจาก nginx ให้ www-data อ่านได้)
#   sudo chmod -R 755 /path/to/lasc-students_app/coop-backend/uploads
#   sudo chown -R www-data:www-data /path/to/lasc-students_app/coop-backend/uploads
#
# Docker: docker-compose.yml mount ./coop-backend:/app อยู่แล้ว
#   → /app/uploads ผูกกับ host อัตโนมัติ ไฟล์ไม่หายเมื่อ rebuild
#   ต้องการ mount เฉพาะโฟลเดอร์ก็เพิ่มใต้ coop-backend:
#     volumes:
#       - ./coop-backend/uploads:/app/uploads
# ---------------------------------------------------------------------
